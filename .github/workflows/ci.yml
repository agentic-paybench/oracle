name: ci

# Gate: pytest (ADR-007 intent-free property test, ADR-009 PDP + mutation
# drill, public-manifest default-deny check, the reader-page render tests)
# + frozen-methodology byte check + VC-JOSE signature verify + the
# right-of-reply Worker suite + the family page gates (DES-100: the
# network-log, layout and axe-core checks and Lighthouse CI with budgets on
# the assembled site). The deploy-pages workflow runs only if this is green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: python -m pip install pytest 'jsonschema>=4'
      - name: Pytest
        run: python -m pytest tests -q
      - name: Verify vendored frozen methodology (byte -> manifest -> anchor)
        run: docs/methodology/verify-vendored-freeze.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed capability VCs (VC-JOSE ES256 / P-256)
        run: |
          cd ingest/signer && npm ci
          cd "$GITHUB_WORKSPACE" && node ingest/signer/verify.mjs

  worker:
    # Right-of-reply channel Worker: lint / typecheck / test / bundle-dry-run.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Bundle (dry-run, no deploy)
        run: npm run build

  pages:
    # The family page gates (DES-100) on the ASSEMBLED site, the same tree the
    # deploy ships. Allowed: the page's own origin and the decided-assets list
    # (family-gates/decided-assets.json; none of its entries is in the
    # repository's files, so here the list passes nothing). A failure here
    # fails ci, and deploy-pages runs only when ci succeeds. The live-URL run
    # is in deploy-pages, after the deploy (family-gates/README.md).
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble site (copies, the G_S21 decision, the reader pages)
        run: bash docs/site/build-site.sh
      - name: Install the gate tools (pinned)
        run: |
          cd family-gates && npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve the assembled site on its own origin
        run: |
          python3 -m http.server 8080 --directory docs/site > /tmp/http.log 2>&1 &
          sleep 1
      - name: Network-log, layout and axe-core checks
        run: node family-gates/check.mjs --base http://127.0.0.1:8080 --out family-gates-report.json --paths / /capabilities/ /tier2/statements.html /roadmap.html /adr/ /methodology/ /404.html '/results/?' '/results/dim02-authorization-latency.v1.1.level1.html?'
      - name: Lighthouse CI with budgets
        run: |
          cd family-gates && npx lhci autorun --config=lighthouserc.json \
            --collect.url=http://127.0.0.1:8080/ \
            --collect.url=http://127.0.0.1:8080/capabilities/ \
            --collect.url=http://127.0.0.1:8080/tier2/statements.html \
            --collect.url=http://127.0.0.1:8080/roadmap.html
      - name: Lighthouse third-party and script budgets against the decided list
        run: cd family-gates && node lh-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-gates
          path: |
            family-gates-report.json
            family-gates/.lighthouseci
