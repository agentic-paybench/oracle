[project]
name = "agentic-paybench-oracle"
version = "0.0.1"
description = "Day-0 capability oracle: ADR-009 canEmit PDP + Tier-2 factual lookup + frozen methodology"
requires-python = ">=3.11"
dependencies = []  # stdlib only

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pdp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
