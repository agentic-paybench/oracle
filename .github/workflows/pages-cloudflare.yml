name: deploy-pages

# Deploy the static oracle to Cloudflare Pages ONLY after the ci workflow is
# green. Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (maintainer-supplied).
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble site (copies, the G_S21 decision, the reader pages)
        run: bash docs/site/build-site.sh
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy docs/site --project-name agentic-paybench-oracle

  live-gate:
    # The family gates against the LIVE site, after the deploy: the host can
    # inject at the edge what the repository never ships (the Cloudflare Web
    # Analytics beacon was found this way, 2026-10-16). Passes exactly the
    # decided-assets list (family-gates/decided-assets.json) and reports each
    # decided asset seen. It runs after the deploy, so a failure is an alarm
    # on the live site, not a block on it.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble site (to know what the live root page should be)
        run: bash docs/site/build-site.sh
      - name: Wait until the live root page is this build (bounded, 10 minutes)
        run: |
          want=$(sha256sum docs/site/index.html | cut -d' ' -f1)
          for i in $(seq 1 60); do
            got=$(curl -fsS https://oracle.agentic-paybench.dev/ | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then echo "live root page is this build ($i)"; exit 0; fi
            sleep 10
          done
          echo "the live root page did not become this build within 10 minutes"; exit 1
      - name: Install the gate tools (pinned)
        run: |
          cd family-gates && npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Network-log, layout and axe-core checks against the live URL
        run: node family-gates/check.mjs --base https://oracle.agentic-paybench.dev --out family-gates-live-report.json --paths / /capabilities/ /tier2/statements /roadmap /adr/ /methodology/ '/results/?'
      - name: Lighthouse against the live URL, then the decided-list post-check
        run: |
          cd family-gates && npx lhci autorun --config=lighthouserc.json \
            --collect.url=https://oracle.agentic-paybench.dev/ \
            --collect.url=https://oracle.agentic-paybench.dev/capabilities/
          node lh-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-gates-live
          path: |
            family-gates-live-report.json
            family-gates/.lighthouseci
